<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — eodo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="nav-logo">
            <img src="logo-white.png" alt="eodo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="works.html">Works</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="bg-black">
        <div class="contact-container">
            
            <!-- Sol Alan (Mobilde Alt Alan): İletişim Formu -->
            <div class="contact-form-wrapper">
                <form action="https://formsubmit.co/info@eodoworks.com" method="POST">
                    
                    <!-- E-posta Konu Başlığı Ayarı -->
                    <input type="hidden" name="_subject" value="New Contact Form Submission — eodoworks.com">
                    <!-- Spam Bot Koruması & Otomatik Yanıt Geçişi -->
                    <input type="hidden" name="_captcha" value="false">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="First Name" placeholder="First Name (required)" required>
                        </div>
                        <div class="form-group" style="margin-top: 27px;">
                            <input type="text" name="Last Name" placeholder="Last Name (required)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email <span style="font-size: 11px; opacity: 0.6;">(required)</span></label>
                        <input type="email" name="Email" required>
                    </div>

                    <div class="form-group">
                        <label>Message <span style="font-size: 11px; opacity: 0.6;">(required)</span></label>
                        <textarea name="Message" required></textarea>
                    </div>

                    <button type="submit" class="btn-send">SEND</button>
                </form>
            </div>

            <!-- Sağ Alan (Mobilde Üst/Orta Alan): Beyaz Logo -->
            <div class="contact-logo-wrapper">
                <img src="logo-white.png" alt="eodo" style="width: 280px; height: auto;">
            </div>

        </div>
    </main>

    <footer>
        <div class="footer-logo">
            <img src="logo-black.png" alt="eodo">
        </div>
        <div class="footer-copy">© 2026 by eodo.works</div>
        <div class="footer-right">
            <a href="https://www.instagram.com/eodo.works/" target="_blank" aria-label="Instagram">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="mailto:info@eodoworks.com">info@eodoworks.com</a>
        </div>
    </footer>

</body>
</html>
