<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works — eodo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="nav-logo">
            <img src="logo-white.png" alt="eodo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="works.html" class="active">Works</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="bg-black" style="padding: 60px 10%; min-height: 70vh;">
        
        <!-- Proje Kartları Izgarası -->
        <div class="project-grid">

            <!-- ÖRNEK PROJE 1 -->
            <div class="project-card" onclick="openGallery('project1')">
                <div class="img-wrapper">
                    <img src="projects/project1/cover.jpg" alt="Project 1">
                </div>
                <div class="project-info">
                    <h3>Project Name 01</h3>
                    <p>Urban Design / Istanbul, 2026</p>
                </div>
            </div>

            <!-- ÖRNEK PROJE 2 -->
            <div class="project-card" onclick="openGallery('project2')">
                <div class="img-wrapper">
                    <img src="projects/project2/cover.jpg" alt="Project 2">
                </div>
                <div class="project-info">
                    <h3>Project Name 02</h3>
                    <p>Cultural Center / Paris, 2025</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Tam Ekran Görsel İnceleme Modalı (Lightbox) -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeGallery()">&times;</span>
        <button class="lightbox-btn" onclick="changeSlide(-1)">&#10094;</button>
        
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Project Image">
            <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>

        <button class="lightbox-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <footer>
        <div class="footer-logo">
            <img src="logo-black.png" alt="eodo">
        </div>
        <div class="footer-copy">© 2026 by eodo.works</div>
        <div class="footer-right">
            <a href="https://www.instagram.com/eodo.works/" target="_blank" aria-label="Instagram">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="mailto:info@eodoworks.com">info@eodoworks.com</a>
        </div>
    </footer>

    <!-- Galeri Mantığı (JavaScript) -->
    <script>
        // Projelerin Görsel Listeleri
        const projectData = {
            'project1': {
                title: 'Project Name 01',
                images: [
                    'projects/project1/cover.jpg',
                    'projects/project1/1.jpg',
                    'projects/project1/2.jpg',
                    'projects/project1/3.jpg'
                ]
            },
            'project2': {
                title: 'Project Name 02',
                images: [
                    'projects/project2/cover.jpg',
                    'projects/project2/1.jpg',
                    'projects/project2/2.jpg'
                ]
            }
        };

        let currentProject = null;
        let currentIndex = 0;

        function openGallery(projectId) {
            if (!projectData[projectId]) return;
            currentProject = projectData[projectId];
            currentIndex = 0;
            
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeGallery() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function changeSlide(direction) {
            if (!currentProject) return;
            currentIndex += direction;
            
            // Döngüsel geçiş (son görselden sonrakinde başa döner)
            if (currentIndex < 0) {
                currentIndex = currentProject.images.length - 1;
            } else if (currentIndex >= currentProject.images.length) {
                currentIndex = 0;
            }

            updateLightbox();
        }

        function updateLightbox() {
            const imgElement = document.getElementById('lightbox-img');
            const captionElement = document.getElementById('lightbox-caption');
            
            imgElement.src = currentProject.images[currentIndex];
            captionElement.innerText = `${currentProject.title} — (${currentIndex + 1} / ${currentProject.images.length})`;
        }

        // Klavye Yön Tuşları ve ESC Desteği
        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;

            if (event.key === 'Escape') closeGallery();
            if (event.key === 'ArrowLeft') changeSlide(-1);
            if (event.key === 'ArrowRight') changeSlide(1);
        });
    </script>

</body>
</html>
